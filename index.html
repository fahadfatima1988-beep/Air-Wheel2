<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Air Steering Wheel - 3D Gesture Driving</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0e14;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas3d {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* Hidden video element used as the input stream */
    #webcam {
      display: none;
    }
    /* Mini camera preview so you can see your hands */
    #preview-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 140px;
      height: 105px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(0, 255, 204, 0.6);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 10;
      background: #000;
    }
    #previewCanvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror camera */
      object-fit: cover;
    }
    /* HUD overlay */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      z-index: 10;
      pointer-events: none;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 8px;
    }
    .hud-title {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .hud-value {
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 24px 32px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #38bdf8;
      z-index: 20;
      max-width: 90%;
    }
    #instructions button {
      margin-top: 16px;
      background: #38bdf8;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: bold;
      color: #0b0e14;
      cursor: pointer;
      font-size: 16px;
    }
  </style>

  <!-- Three.js (3D Graphics) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Instructions popup -->
  <div id="instructions">
    <h2>Air Wheel Controller</h2>
    <p style="margin-top: 10px; color: #cbd5e1; font-size: 14px;">
      Allow camera access, step back slightly, and hold up <b>both hands</b> like holding a steering wheel. Tilt your hands to turn!
    </p>
    <button id="startBtn">Start Engine</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">Steering Angle</div>
      <div class="hud-value" id="angleDisplay">0°</div>
    </div>
    <div class="hud-card">
      <div class="hud-title">Speed</div>
      <div class="hud-value">110 <span style="font-size: 14px;">KM/H</span></div>
    </div>
  </div>

  <!-- Camera mini-preview -->
  <div id="preview-container">
    <canvas id="previewCanvas"></canvas>
  </div>

  <video id="webcam" playsinline></video>
  <canvas id="canvas3d"></canvas>

  <script>
    // --- 1. Three.js 3D Scene Setup ---
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3);
    camera.lookAt(0, 1.0, 0);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const redLight = new THREE.PointLight(0xff0055, 2, 10);
    redLight.position.set(0, 0.5, 1.5);
    scene.add(redLight);

    // --- 2. Build 3D Steering Wheel ---
    const wheelGroup = new THREE.Group();
    wheelGroup.position.set(0, 0.85, 2.1); // Placed right in front of the driver
    scene.add(wheelGroup);

    // Rim
    const rimGeo = new THREE.TorusGeometry(0.38, 0.035, 16, 64);
    const leatherMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.1 });
    const rim = new THREE.Mesh(rimGeo, leatherMat);
    wheelGroup.add(rim);

    // Center Hub
    const hubGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.04, 32);
    hubGeo.rotateX(Math.PI / 2);
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
    const hub = new THREE.Mesh(hubGeo, metalMat);
    wheelGroup.add(hub);

    // Center Emblem
    const emblemGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.042, 32);
    emblemGeo.rotateX(Math.PI / 2);
    const emblemMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
    const emblem = new THREE.Mesh(emblemGeo, emblemMat);
    wheelGroup.add(emblem);

    // Spokes
    function createSpoke(rotationZ) {
      const spokeGeo = new THREE.BoxGeometry(0.28, 0.04, 0.02);
      const spoke = new THREE.Mesh(spokeGeo, metalMat);
      spoke.position.x = 0.14;
      const pivot = new THREE.Group();
      pivot.rotation.z = rotationZ;
      pivot.add(spoke);
      return pivot;
    }
    wheelGroup.add(createSpoke(0));                 // Right spoke
    wheelGroup.add(createSpoke(Math.PI));           // Left spoke
    wheelGroup.add(createSpoke(-Math.PI / 2));      // Bottom spoke

    // Tilt the wheel slightly back like a real sports car
    wheelGroup.rotation.x = -0.3;

    // --- 3. Build Endless Road & Scenery ---
    const roadGroup = new THREE.Group();
    scene.add(roadGroup);

    // Road surface
    const roadGeo = new THREE.PlaneGeometry(8, 200);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x151821, roughness: 0.8 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -90;
    roadGroup.add(road);

    // Road Lines
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const stripes = [];
    for (let i = 0; i < 30; i++) {
      const stripeGeo = new THREE.PlaneGeometry(0.15, 2.5);
      const stripe = new THREE.Mesh(stripeGeo, lineMat);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.01, -i * 6);
      roadGroup.add(stripe);
      stripes.push(stripe);
    }

    // Side markers / Neon light pillars
    const pillars = [];
    const pillarGeo = new THREE.BoxGeometry(0.1, 1.2, 0.1);
    const pillarMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
    for (let i = 0; i < 20; i++) {
      const leftP = new THREE.Mesh(pillarGeo, pillarMat);
      leftP.position.set(-4.2, 0.6, -i * 10);
      roadGroup.add(leftP);
      pillars.push(leftP);

      const rightP = new THREE.Mesh(pillarGeo, pillarMat);
      rightP.position.set(4.2, 0.6, -i * 10);
      roadGroup.add(rightP);
      pillars.push(rightP);
    }

    // --- 4. Hand Tracking & Steering Calculation ---
    let targetSteerAngle = 0;
    let currentSteerAngle = 0;
    let roadCarX = 0;

    const angleDisplay = document.getElementById('angleDisplay');
    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');
    const videoElement = document.getElementById('webcam');

    function onHandsResults(results) {
      // Draw camera preview
      previewCanvas.width = videoElement.videoWidth || 320;
      previewCanvas.height = videoElement.videoHeight || 240;
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
        // Two hands detected -> calculate slope between the two wrists/hands
        const hand1 = results.multiHandLandmarks[0][0]; // Wrist landmark
        const hand2 = results.multiHandLandmarks[1][0];

        // Sort left vs right based on screen x coordinate
        const leftHand = hand1.x < hand2.x ? hand1 : hand2;
        const rightHand = hand1.x < hand2.x ? hand2 : hand1;

        // Invert X because camera is mirrored
        const dx = (rightHand.x - leftHand.x);
        const dy = (rightHand.y - leftHand.y);

        // Steering angle calculation in radians
        targetSteerAngle = Math.atan2(dy, dx);
      } else if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
        // Single hand fallback: use angle between wrist and index finger tip
        const landmarks = results.multiHandLandmarks[0];
        const wrist = landmarks[0];
        const indexTip = landmarks[8];
        const dx = indexTip.x - wrist.x;
        const dy = indexTip.y - wrist.y;
        targetSteerAngle = -Math.atan2(dx, -dy) * 1.5;
      } else {
        // Slowly return wheel to center when hands are released
        targetSteerAngle *= 0.85;
      }

      // Clamp angle between -90 and +90 degrees (~1.57 rad)
      targetSteerAngle = Math.max(-1.5, Math.min(1.5, targetSteerAngle));
    }

    // Initialize MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onHandsResults);

    // Setup Camera
    let cameraPipe = null;
    document.getElementById('startBtn').addEventListener('click', async () => {
      document.getElementById('instructions').style.display = 'none';
      cameraPipe = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 480,
        height: 360,
        facingMode: 'user'
      });
      cameraPipe.start();
    });

    // --- 5. Main Animation Loop ---
    const speed = 1.1;

    function animate() {
      requestAnimationFrame(animate);

      // Smooth steering interpolation (lerp)
      currentSteerAngle += (targetSteerAngle - currentSteerAngle) * 0.15;
      wheelGroup.rotation.z = -currentSteerAngle;

      // Update degrees in HUD
      const deg = Math.round(-currentSteerAngle * (180 / Math.PI));
      angleDisplay.textContent = `${deg > 0 ? '+' : ''}${deg}°`;

      // Lateral movement: turning the wheel moves your viewpoint left/right
      roadCarX += currentSteerAngle * 0.05;
      roadCarX = Math.max(-2.2, Math.min(2.2, roadCarX));
      camera.position.x = roadCarX;
      wheelGroup.position.x = roadCarX;

      // Endless road forward animation
      stripes.forEach(stripe => {
        stripe.position.z += speed;
        if (stripe.position.z > 5) stripe.position.z -= 180;
      });

      pillars.forEach(p => {
        p.position.z += speed;
        if (p.position.z > 5) p.position.z -= 200;
      });

      renderer.render(scene, camera);
    }

    animate();

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
